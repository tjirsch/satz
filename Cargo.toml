[package]
name = "satz"
version = "0.67.1"
edition = "2021"
authors = ["Thomas Jirsch"]
description = "Infrastructure with a constitution — proven live. Compiles Satz estates to OpenTofu/Terraform HCL and proves declared controls against the live Google Cloud organisation."
license = "Apache-2.0"
repository = "https://github.com/tjirsch/satz"
homepage = "https://tjirsch.github.io/satz/"
readme = "README.md"
keywords = [
    "terraform",
    "opentofu",
    "satz",
    "infrastructure-as-code",
    "transpiler",
    "google-cloud",
    "infrastructure-discovery"
]
categories = ["command-line-utilities", "development-tools"]
# satz is released as a binary, never to crates.io — as the two library crates say
# for themselves. cargo-about reads it to keep this workspace out of
# THIRD-PARTY-LICENSES.md.
publish = false

# `publish = false` also hides the binary from dist, which then finds nothing to
# release; this says that this package IS the release.
[package.metadata.dist]
dist = true

[dependencies]
satz-core = { path = "crates/satz-core" }
satz-hcl = { path = "crates/satz-hcl" }
hcl-rs = "0.19.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0"
serde_path_to_error = "0.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
terminal_size = "0.4"
clap_complete = "4.6"
toml = "1.1"
# `satz silence add|remove` edits the estate's own config.toml: a format-preserving
# document, so the operator's comments and layout survive satz adding one table.
toml_edit = "0.22"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
# The MCP surface (`satz mcp`). The official SDK rather than a hand-rolled
# JSON-RPC shim: the spec negotiates per request via `_meta`, adds a mandatory
# `server/discover`, and keeps a compatibility path for the initialize-based
# revisions — three moving parts, in a spec that has revised five times.
rmcp = { version = "3.2", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
google-cloud-auth = "1.15"
reqwest = { version = "0.13.4", features = ["json"] }
sha2 = "0.11"
hex = "0.4"
google-cloud-asset-v1 = "1.12.0"
google-cloud-gax = "1.13.0"
rust_xlsxwriter = "0.99"
# The language server (`satz lsp`): rust-analyzer's transport — a synchronous
# loop over stdio, no second runtime — the protocol types, and file URLs.
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts"] }
pulldown-cmark = "0.13.4"
typst-layout = "0.15.1"
futures-util = "0.3.34"

[dev-dependencies]
# the workbook test opens the xlsx package; the same zip rust_xlsxwriter writes with
zip = "8.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
opt-level = "z"          # optimize for size (vs "s" which is slightly less aggressive)
lto = true               # full LTO — more effective than "thin" for size
codegen-units = 1        # single codegen unit enables better dead code elimination
strip = true             # strip symbols and debug info from the binary
panic = "abort"          # removes unwinding machinery (~50-100KB)

# Workspace root: the satz binary plus the satz-core library (the typed
# composition core growing strangler-fig style; see the private roadmap).
[workspace]
members = ["crates/satz-core", "crates/satz-hcl"]
