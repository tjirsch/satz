<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="The pack loop in four rows. Row one: the library, the presets folder on the satz repository's main branch, which satz get-presets installs from; the estate's own presets folder, where X.satz is upstream's pristine copy, X.local.satz your fork and X.diff.satz the delta rewritten on every merge; and satz check-presets, which reports each pack as clean, STALE, EDITED variables only, EDITED structural, fork, missing locally or local-only, and exits non-zero on drift in an included pack. Row two: satz merge-presets refreshes a pack behind upstream, forks an edited one to X.local.satz and repoints the estate with the delta in X.diff.satz, and writes the commented use line for a pack the library gained; the estate file holds one use line per pack under its phase, commented until the pack is on, and the params. Row three: satz questions --unanswered lists what a new pack or version asks; satz interview binds each answer as a param and uncomments the line of a pack whose question is answered true, --accept-defaults binds every default; then transpile, plan and apply, one pack per apply, and the compile reports a question answered true whose line is still commented. Row four, satz studio: the Map view enables a pack, its switches and oneof choices, and runs merge-presets for an Absent row; the Interview view asks the questions a pack brings; Commands runs check-presets, get-presets, merge-presets, transpile and plan in the app and hands apply to the terminal; the diagnostics drawer shows the compile's findings.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="660" fill="#FFFFFF"/>

  <!-- ===== row 1: library → estate presets → check ===== -->
  <rect x="20" y="20" width="270" height="118" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="34" y="42" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">the library</text>
  <text x="34" y="60" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">presets/ on the satz repository's main</text>
  <text x="34" y="74" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">branch; a push publishes a pack</text>
  <text x="34" y="98" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#1B2430" font-weight="500">satz get-presets</text>
  <text x="34" y="112" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">installs what is missing, refreshes what</text>
  <text x="34" y="126" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the estate does not use; in-use: refused</text>
  <line x1="290" y1="79" x2="343" y2="79" stroke="#1B2430" marker-end="url(#arr)"/>

  <rect x="345" y="20" width="270" height="118" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="359" y="42" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">the estate's presets/</text>
  <text x="359" y="64" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#1B2430" font-weight="500">X.satz</text>
  <text x="462" y="64" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">upstream's pristine copy</text>
  <text x="359" y="84" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#1B2430" font-weight="500">X.local.satz</text>
  <text x="462" y="84" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">your fork, never touched</text>
  <text x="359" y="104" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#1B2430" font-weight="500">X.diff.satz</text>
  <text x="462" y="104" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">fork vs pristine, rewritten</text>
  <text x="462" y="118" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">on every merge</text>
  <text x="359" y="130" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the suffix says who owns the file</text>
  <line x1="615" y1="79" x2="668" y2="79" stroke="#1B2430" marker-end="url(#arr)"/>

  <rect x="670" y="20" width="270" height="118" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="684" y="42" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0F766E" font-weight="500">satz check-presets x.satz</text>
  <text x="684" y="60" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">read-only; per pack, the version line and</text>
  <text x="684" y="74" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the content comparison:</text>
  <text x="684" y="94" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" font-weight="500">clean · STALE · fork</text>
  <text x="684" y="108" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" font-weight="500">EDITED (variables only | structural)</text>
  <text x="684" y="122" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" font-weight="500">missing locally · local-only</text>
  <text x="684" y="134" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">drift in an [included] pack exits non-zero</text>

  <!-- ===== row 2: merge → the estate file ===== -->
  <line x1="805" y1="138" x2="805" y2="160" stroke="#0F766E" stroke-width="1.5"/>
  <line x1="805" y1="160" x2="240" y2="160" stroke="#0F766E" stroke-width="1.5"/>
  <line x1="240" y1="160" x2="240" y2="176" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr-acc)"/>

  <rect x="20" y="178" width="440" height="128" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="34" y="200" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0F766E" font-weight="500">satz merge-presets</text>
  <text x="34" y="222" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">behind upstream, unedited → refreshed in place</text>
  <text x="34" y="238" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">edited, and upstream changed its meaning → forked to X.local.satz, the estate</text>
  <text x="34" y="252" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">repointed, the delta in X.diff.satz — proven by an identical transpile</text>
  <text x="34" y="268" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">comment or format churn only → upgraded silently</text>
  <text x="34" y="284" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">a pack the library gained → its use line written, commented, under its phase</text>
  <text x="34" y="298" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">--adopt takes upstream in place; --report-only writes nothing</text>
  <line x1="460" y1="242" x2="518" y2="242" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr-acc)"/>

  <rect x="520" y="178" width="420" height="128" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="534" y="200" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">the estate file</text>
  <text x="534" y="220" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430">use "presets/estate-core.satz"</text>
  <text x="534" y="234" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" opacity="0.6">// after the switch to the service account</text>
  <text x="534" y="248" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" opacity="0.6">// use "presets/CIS-GCP-Foundation-4.0.satz"</text>
  <text x="534" y="262" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430">params { … }</text>
  <text x="534" y="284" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">a pack is on when its use line is uncommented; answering</text>
  <text x="534" y="298" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">its question true uncomments it, and nothing re-comments it</text>

  <!-- ===== row 3: questions → interview → transpile/plan/apply ===== -->
  <line x1="730" y1="306" x2="730" y2="328" stroke="#1B2430"/>
  <line x1="730" y1="328" x2="165" y2="328" stroke="#1B2430"/>
  <line x1="165" y1="328" x2="165" y2="344" stroke="#1B2430" marker-end="url(#arr)"/>

  <rect x="20" y="346" width="290" height="104" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="34" y="368" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">satz questions x.satz</text>
  <text x="34" y="382" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">  --unanswered</text>
  <text x="34" y="402" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">what a new pack, or a new version of one,</text>
  <text x="34" y="416" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">asks; bootstrap and apply refuse while any</text>
  <text x="34" y="430" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">question is open</text>
  <line x1="310" y1="398" x2="343" y2="398" stroke="#1B2430" marker-end="url(#arr)"/>

  <rect x="345" y="346" width="290" height="104" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="359" y="368" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0F766E" font-weight="500">satz interview x.satz</text>
  <text x="359" y="386" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">one question at a time; each answer is bound</text>
  <text x="359" y="400" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">as a param; a pack question answered true</text>
  <text x="359" y="414" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">uncomments its use line</text>
  <text x="359" y="434" font-family="IBM Plex Mono, Menlo, monospace" font-size="10.5" fill="#1B2430" font-weight="500">--accept-defaults</text>
  <text x="490" y="434" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">binds every default</text>
  <line x1="635" y1="398" x2="668" y2="398" stroke="#0F766E" stroke-width="1.5" marker-end="url(#arr-acc)"/>

  <rect x="670" y="346" width="270" height="104" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="684" y="368" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0F766E" font-weight="500">satz transpile → plan → apply</text>
  <text x="684" y="386" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">one pack per apply, as the service account</text>
  <text x="684" y="406" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the compile reports a question answered</text>
  <text x="684" y="420" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">true whose use line is still commented, or</text>
  <text x="684" y="434" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">missing: an answer nothing emits</text>

  <text x="34" y="472" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">After every satz release: back to check-presets. A pack the estate includes never changes silently — a semantic change forks, comment churn upgrades.</text>

  <!-- ===== row 4: satz studio ===== -->
  <rect x="20" y="490" width="920" height="150" rx="6" fill="#EEF1F3" stroke="#0F766E" stroke-width="1.5"/>
  <text x="34" y="510" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#0F766E" font-weight="500">SATZ STUDIO</text>
  <text x="128" y="510" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#0F766E">the same loop through the app's views — satz's own writer binds answers and toggles the lines</text>

  <rect x="34" y="522" width="212" height="104" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="44" y="542" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">Map</text>
  <text x="44" y="558" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">one row per pack: Enable, its</text>
  <text x="44" y="572" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">switches, a segmented oneof;</text>
  <text x="44" y="586" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">a pack with no line reads</text>
  <text x="44" y="600" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">Absent → merge-presets, one</text>
  <text x="44" y="614" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">click</text>

  <rect x="260" y="522" width="212" height="104" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="270" y="542" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">Interview</text>
  <text x="270" y="558" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the questions a pack brings,</text>
  <text x="270" y="572" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">with why, reversal and blast;</text>
  <text x="270" y="586" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">accept one default or all;</text>
  <text x="270" y="600" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the rail shows how many are</text>
  <text x="270" y="614" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">still open</text>

  <rect x="486" y="522" width="212" height="104" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="496" y="542" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">Commands</text>
  <text x="496" y="558" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">check-presets, get-presets,</text>
  <text x="496" y="572" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">merge-presets, questions,</text>
  <text x="496" y="586" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">transpile, plan — run in the</text>
  <text x="496" y="600" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">app with the log streamed;</text>
  <text x="496" y="614" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">apply in the terminal</text>

  <rect x="712" y="522" width="212" height="104" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="722" y="542" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">Diagnostics · Chat</text>
  <text x="722" y="558" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">the compile's findings at</text>
  <text x="722" y="572" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">their file and line, incl. a</text>
  <text x="722" y="586" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">true answer with no line;</text>
  <text x="722" y="600" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">Chat drives the same satz</text>
  <text x="722" y="614" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">tools, writes only on approval</text>
</svg>
