<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Two spheres over one live organisation. Left, the Satz sphere: estate and packs with deviates claims, transpiled and applied; require and report-compliance judge and verify; a concept-facts export feeds the security concept. Right, the audit sphere: Prowler audits the whole organisation, not only what Satz declared; its OCSF findings and compliance files go to a triage that yields a remediation plan; Claude writes the security concept. Five integration points connect them: catalogs imported from Prowler's compliance files, OCSF findings corroborating the evidence report, the triage feeding the remediation plan back into estate and packs, deviates claims resolving findings as accepted exceptions, and the concept-facts export feeding the concept document.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#FFFFFF"/>

  <!-- spheres -->
  <rect x="20" y="20" width="450" height="440" rx="6" fill="#EEF1F3" stroke="#1B2430" stroke-opacity="0.35"/>
  <text x="34" y="44" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#1B2430" font-weight="500">SATZ SPHERE</text>
  <text x="34" y="62" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="15" fill="#1B2430">declares, proves what it declared</text>

  <rect x="490" y="20" width="450" height="440" rx="6" fill="#EEF1F3" stroke="#1B2430" stroke-opacity="0.35"/>
  <text x="504" y="44" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#1B2430" font-weight="500">AUDIT SPHERE</text>
  <text x="504" y="62" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="15" fill="#1B2430">the external auditor — sees everything</text>

  <!-- live org -->
  <rect x="20" y="490" width="920" height="90" rx="6" fill="#EEF1F3" stroke="#0F766E" stroke-width="1.5"/>
  <text x="34" y="514" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#0F766E" font-weight="500">LIVE ORGANISATION</text>
  <rect x="200" y="520" width="240" height="46" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="320" y="540" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1B2430" font-weight="500">what Satz declared</text>
  <text x="320" y="556" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">org policies · IAM · logging · alerting</text>
  <rect x="520" y="520" width="380" height="46" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6" stroke-dasharray="4 3"/>
  <text x="710" y="540" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#1B2430" font-weight="500">everything else</text>
  <text x="710" y="556" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">workloads · apps · Cloud Run · Firebase · IAP · what nobody declared</text>

  <!-- SATZ boxes (bottom-up) -->
  <rect x="60" y="380" width="380" height="56" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="250" y="402" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">transpile → main.tf → tofu apply</text>
  <text x="250" y="420" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">HCL: the IaC layer</text>

  <rect x="60" y="290" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="250" y="311" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">estate.satz + packs</text>
  <text x="250" y="329" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">params · use · suppress · claim … deviates { reason }</text>

  <rect x="60" y="200" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="250" y="221" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">require · report-compliance</text>
  <text x="250" y="239" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">catalogs · claims · witnesses by value · evidence/*.json</text>

  <rect x="60" y="110" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="250" y="131" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#0F766E" font-weight="500">concept-facts export</text>
  <text x="250" y="149" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">per control: pack · witnesses · evidence · duties · deviations · Prowler</text>

  <!-- AUDIT boxes (bottom-up) -->
  <rect x="530" y="380" width="380" height="56" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="720" y="402" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">prowler gcp --compliance &lt;framework&gt;</text>
  <text x="720" y="420" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">read-only audit SA · CIS · ISO 27001 · C5 · NIS2</text>

  <rect x="530" y="290" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="720" y="311" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">raw/ · OCSF findings + compliance files</text>
  <text x="720" y="329" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">evidence archive, unchanged · thousands of findings</text>

  <rect x="530" y="200" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="720" y="221" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#1B2430" font-weight="500">triage → remediation plan</text>
  <text x="720" y="239" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">Claude: every FAIL with a concrete way to fix it</text>

  <rect x="530" y="110" width="380" height="60" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="720" y="131" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12.5" fill="#0F766E" font-weight="500">security concept</text>
  <text x="720" y="149" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.75">Claude: scope · layers of defence · measures · evidence method</text>

  <!-- vertical flows -->
  <line x1="250" y1="350" x2="250" y2="378" stroke="#1B2430" marker-end="url(#a)"/>
  <line x1="250" y1="436" x2="250" y2="518" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="480" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430">apply</text>
  <line x1="130" y1="290" x2="130" y2="262" stroke="#1B2430" marker-end="url(#a)"/>
  <text x="138" y="280" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430">claims</text>
  <polyline points="120,518 120,470 100,470 100,262" fill="none" stroke="#1B2430" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="66" y="470" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">live,</text>
  <text x="66" y="483" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">by value</text>
  <line x1="250" y1="200" x2="250" y2="172" stroke="#0F766E" stroke-width="1.5" marker-end="url(#aa)"/>

  <polyline points="720,518 720,470 720,438" fill="none" stroke="#1B2430" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="728" y="470" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430">audits ALL of it</text>
  <polyline points="440,543 470,543 470,470 650,470 650,438" fill="none" stroke="#1B2430" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <line x1="720" y1="380" x2="720" y2="352" stroke="#1B2430" marker-end="url(#a)"/>
  <line x1="720" y1="290" x2="720" y2="262" stroke="#1B2430" marker-end="url(#a)"/>

  <!-- integration points (accent) -->
  <!-- I1 catalogs from compliance files: raw -> require -->
  <polyline points="530,300 485,300 485,215 442,215" fill="none" stroke="#0F766E" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="465" y="262" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">I1</text>
  <!-- I2 OCSF corroborates evidence: raw -> report-compliance -->
  <line x1="530" y1="330" x2="442" y2="245" stroke="#0F766E" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="500" y="345" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">I2</text>
  <!-- I3 remediation plan -> estate/packs -->
  <line x1="530" y1="240" x2="442" y2="305" stroke="#0F766E" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="472" y="288" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">I3</text>
  <!-- I4 deviates -> triage (exceptions) -->
  <line x1="440" y1="340" x2="528" y2="255" stroke="#0F766E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aa)"/>
  <text x="515" y="275" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">I4</text>
  <!-- I5 concept-facts -> concept -->
  <line x1="440" y1="140" x2="528" y2="140" stroke="#0F766E" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="485" y="133" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#0F766E" font-weight="500">I5</text>

  <!-- legend -->
  <text x="34" y="84" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#0F766E">I1 catalogs from Prowler's compliance files · I2 findings corroborate evidence · I3 remediation plan is input for Satz</text>
  <text x="34" y="98" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#0F766E">I4 deviates = the exception register · I5 concept facts, deterministic; the prose is Claude's</text>
</svg>
