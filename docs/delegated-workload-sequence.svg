  <text x="560" y="104" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">write the pack pair</text>
  <text x="560" y="123" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">packs/catalog-delegation.satz and catalog-workload.satz; satz review-pack</text>
  <rect x="520" y="162" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="540" cy="182" r="11" fill="#1B2430"/>
  <text x="540" y="186" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">2</text>
  <text x="560" y="186" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">find the roles</text>
  <text x="560" y="205" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">update-prerequisites --report-only: the roles go into the delegation pack</text>
  <rect x="520" y="244" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="540" cy="264" r="11" fill="#1B2430"/>
  <text x="540" y="268" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">3</text>
  <text x="560" y="268" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">make the delegation pack reachable</text>
  <text x="560" y="287" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">a pack source: packs/, a GitHub repository, or satz publish-pack</text>
  <rect x="40" y="326" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="60" cy="346" r="11" fill="#1B2430"/>
  <text x="60" y="350" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">4</text>
  <text x="80" y="350" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">fetch it</text>
  <text x="80" y="369" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">satz pack-source add, satz get-pack --source</text>
  <rect x="40" y="408" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.95" stroke-dasharray="5 4"/>
  <circle cx="60" cy="428" r="11" fill="#0F766E"/>
  <text x="60" y="432" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">4</text>
  <text x="80" y="432" font-family="Newsreader, Georgia, serif" font-size="14" fill="#1B2430" font-style="italic">Review the pack</text>
  <text x="80" y="451" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">what it creates and grants is what the organization signs for</text>
  <rect x="40" y="490" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="60" cy="510" r="11" fill="#1B2430"/>
  <text x="60" y="514" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">4</text>
  <text x="80" y="514" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">write the named use, plan, apply</text>
  <text x="80" y="533" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">use … named books; books.&lt;param&gt; = …; --plan, then --apply</text>
  <rect x="40" y="572" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.95" stroke-dasharray="5 4"/>
  <circle cx="60" cy="592" r="11" fill="#0F766E"/>
  <text x="60" y="596" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">5</text>
  <text x="80" y="596" font-family="Newsreader, Georgia, serif" font-size="14" fill="#1B2430" font-style="italic">Copy the interface folders</text>
  <text x="80" y="615" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">delegation-books/ and books-project/, whole</text>
  <rect x="520" y="654" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="540" cy="674" r="11" fill="#1B2430"/>
  <text x="540" y="678" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">6</text>
  <text x="560" y="678" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">take them into interfaces/incoming/</text>
  <text x="560" y="697" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">replace the stand-ins; satz init --from writes a new estate</text>
  <rect x="520" y="736" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#0F766E" stroke-opacity="0.95" stroke-dasharray="5 4"/>
  <circle cx="540" cy="756" r="11" fill="#0F766E"/>
  <text x="540" y="760" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">6</text>
  <text x="560" y="760" font-family="Newsreader, Georgia, serif" font-size="14" fill="#1B2430" font-style="italic">Be in the group, and sign in</text>
  <text x="560" y="779" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">membership is the directory&#x27;s; gcloud auth application-default login</text>
  <rect x="520" y="818" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="540" cy="838" r="11" fill="#1B2430"/>
  <text x="540" y="842" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#FFFFFF" font-weight="500">6</text>
  <text x="560" y="842" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#1B2430" font-weight="500">plan, read, apply</text>
  <text x="560" y="861" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">satz transpile &lt;estate&gt; --plan, then --apply: as svc-deploy-books</text>
