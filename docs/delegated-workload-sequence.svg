  <text x="480.0" y="318" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#0F766E" font-weight="500">the delegation pack, through the pack source</text>
  <line x1="240.0" y1="384" x2="240.0" y2="406" stroke="#1B2430" marker-end="url(#q-arr)"/>
  <line x1="240.0" y1="466" x2="240.0" y2="488" stroke="#1B2430" marker-end="url(#q-arr)"/>
  <line x1="240.0" y1="548" x2="240.0" y2="570" stroke="#1B2430" marker-end="url(#q-arr)"/>
  <path d="M240.0,630 L240.0,642 L720.0,642 L720.0,652" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#q-arr-acc)"/>
