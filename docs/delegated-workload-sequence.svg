<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1002" width="960" height="1002" role="img" aria-label="A swimlane of the procedure, the organization&#x27;s team on the left and the workload&#x27;s team on the right, each step numbered by its section of the page. Workload&#x27;s team: 2, write the pack pair, the delegation pack catalog-delegation.satz and the workload pack catalog-workload.satz, and review them with satz review-pack; 2, find the roles with satz update-prerequisites --report-only and write them into the delegation pack&#x27;s grants; 3, make the delegation pack reachable through a pack source: the packs folder, a GitHub repository, or satz publish-pack. The first crossing, the delegation pack, leads to the organization&#x27;s team. Organization&#x27;s team: 4, fetch it with satz pack-source add and satz get-pack --source; 4, a step people do: review the pack, since what it creates and grants is what the organization signs for; 4, write the named use line use packs/catalog-delegation.satz named books and the use&#x27;s values books.&lt;param&gt;, then plan and apply; 5, a step people do: copy the interface folders delegation-books and books-project, whole. The second crossing, the interface folders, leads back to the workload&#x27;s team. Workload&#x27;s team: 6, take them into interfaces/incoming, replacing the stand-ins, or let satz init --from write a new estate from them; 6, a step people do: be in the estate account user group and sign in with gcloud auth application-default login; 6, plan, read and apply as the delegation&#x27;s estate account svc-deploy-books. A dashed arrow leads from the last step back to finding the roles: a role is missing, so a new version of the delegation pack, section 7.">
  <defs>
    <marker id="q-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2430"/></marker>
    <marker id="q-arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="1002" fill="#FFFFFF"/>
  <rect x="20" y="20" width="440" height="872" rx="6" fill="#EEF1F3" stroke="#1B2430" stroke-opacity="0.35"/>
  <text x="34" y="42" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#1B2430" font-weight="500">ORGANIZATION&#x27;S TEAM</text>
  <text x="34" y="60" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#1B2430">owns the organization&#x27;s estate and its state</text>
  <rect x="500" y="20" width="440" height="872" rx="6" fill="#EEF1F3" stroke="#1B2430" stroke-opacity="0.35"/>
  <text x="514" y="42" font-family="IBM Plex Mono, Menlo, monospace" font-size="11.5" letter-spacing="1.2" fill="#1B2430" font-weight="500">WORKLOAD&#x27;S TEAM</text>
  <text x="514" y="60" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="13" fill="#1B2430">owns the workload repository and the workload&#x27;s state</text>
  <rect x="520" y="80" width="400" height="58" rx="4" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <circle cx="540" cy="100" r="11" fill="#1B2430"/>
