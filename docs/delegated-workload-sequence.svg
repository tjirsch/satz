  <line x1="720.0" y1="712" x2="720.0" y2="734" stroke="#1B2430" marker-end="url(#q-arr)"/>
  <line x1="720.0" y1="794" x2="720.0" y2="816" stroke="#1B2430" marker-end="url(#q-arr)"/>
  <path d="M920,847.0 L948,847.0 L948,191.0 L922,191.0" fill="none" stroke="#0F766E" stroke-dasharray="5 4" marker-end="url(#q-arr-acc)"/>
  <text x="938" y="500" text-anchor="end" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="12" fill="#0F766E">7 — a role is missing at the apply:</text>
  <text x="938" y="516" text-anchor="end" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="12" fill="#0F766E">a new version of the delegation pack</text>
  <rect x="20" y="910" width="46" height="18" rx="3" fill="#FFFFFF" stroke="#0F766E" stroke-dasharray="5 4"/>
  <text x="74" y="923" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#1B2430">a step people do: a review, a copy, a sign-in</text>
  <rect x="430" y="910" width="46" height="18" rx="3" fill="#FFFFFF" stroke="#1B2430" stroke-opacity="0.6"/>
  <text x="484" y="923" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#1B2430">a step done with satz, in the terminal or in satz-studio</text>
  <rect x="20" y="940" width="46" height="4" fill="#0F766E"/>
  <text x="74" y="946" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#1B2430">what crosses from one team to the other</text>
  <text x="20" y="972" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="10.5" fill="#1B2430" opacity="0.8">The numbers are the sections of this page. The example: the workload catalog, the named use books, Acme Corp. of docs/examples.md.</text>
