[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Post-announce jobs to run in CI
post-announce-jobs = ["./attach-checksum", "./prune-artifacts"]
# dist packs LICENSE and README into every archive by itself, but not NOTICE, which
# Apache 2.0 §4(d) asks every redistribution to carry (ADR 0022), and not
# THIRD-PARTY-LICENSES.md, the licence text of every crate compiled into the binary
# that MIT and Apache 2.0 ask a binary redistribution to carry
# (scripts/update-third-party-licenses.sh generates it). The last two are the font
# licences: the SIL Open Font License and the Bitstream licence ask a redistributor
# to carry their text with the faces, and the faces are inside the binary.
include = [
    "NOTICE",
    "THIRD-PARTY-LICENSES.md",
    "assets/fonts/LICENSE-Libertinus-OFL.txt",
    "assets/fonts/LICENSE-DejaVu.txt",
]

# The Release workflow grants `contents: write` and a called workflow can only NARROW
# what its caller granted, so prune-artifacts asking for `actions: write` on its own
# failed the whole run before a job started. The grant has to come from the caller, and
# in a generated file that means from here.
[dist.github-custom-job-permissions.prune-artifacts]
actions = "write"
