[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.3"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu"
]
# build every artifact on this pull request, to prove the Windows builds before a tag
# does — set back to "plan" before merging
pr-run-mode = "upload"
install-path = "~/.local/bin"
hosting = "github"
install-updater = false
post-announce-jobs = ["./attach-checksum"]
