[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.30.3"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu"
]
install-path = "~/.local/bin"
hosting = "github"
install-updater = false
post-announce-jobs = ["./attach-checksum", "./prune-artifacts"]

# ARM64 Windows builds natively: cargo-dist's default cross-build (cargo-xwin in a Linux
# container) assembles psm's ARM64 source with clang-cl, which rejects it
[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-11-arm"
host = "aarch64-pc-windows-msvc"
