# Maßnahmenkatalog für den Remediation-Plan — deckt JEDE Kontrolle des CIS GCP Foundations
# Benchmark v5.0 (93). build_audit.py wählt daraus die Maßnahmen, deren Kontrollen im Scan
# FAIL / LÜCKE / FALSE POSITIVE sind (kind: review zusätzlich für MANUAL), nummeriert sie in
# Phasenreihenfolge (sofort → kurzfristig → nach_freigabe → laufend → review) und füllt die
# Platzhalter mit den Werten der Umgebung. Kontrollen ohne Ressourcen (N/A) landen in der
# Wiedervorlage-Tabelle mit dem Pack, das sie beim Rollout abdeckt.
#
# Platzhalter: {org_id} {domain} {kunde} {shortcode} {estate_repo} {estate_file} {iac_sa}
#              {infra_project} {n_own} {n_fleet} {fleet_label} {projects} {resources}
#              {log_project} {default_region}
# Felder: id, title, phase, kind (satz-apply | satz-pack | gcloud | decision | review),
#         controls, packs (satz-Pack-IDs, wie `satz require` sie in "Provides" nennt),
#         aufwand, risiko, why, satz (Code), gcloud (Code), terraform (Code),
#         prereq (Liste), nachweis, open_point (Text für "Offene Punkte")
measures:

- id: estate-apply
  title: Konvergiertes Estate anwenden (Org-Policies des CIS-Packs)
  phase: sofort
  kind: satz-apply
  controls: ["1.1.4", "1.2", "1.5", "1.6", "3.1", "4.4", "4.5", "4.6", "4.9", "5.1", "5.2"]
  packs: [CIS_GCP_Foundation_4_0]
  aufwand: "ca. 30 Minuten (Plan lesen, Apply, Nachweis)"
  risiko: "gering — Org-Policies wirken präventiv und additiv; bestehende Ressourcen werden nicht verändert, nur neue Verstöße verhindert"
  why: >-
    Diese Kontrollen sind im Estate als Org-Policies des CIS-Packs deklariert (Domain Restricted
    Sharing, keine SA-Schlüssel, kein Default-Netzwerk, OS Login, kein Serial-Port-Zugriff, kein
    IP-Forwarding, keine externen IPs, Public-Access-Prevention, Uniform Bucket-Level Access). Wo der
    Scan trotzdem FAIL oder satz DRIFTED meldet, ist die Deklaration noch nicht angewendet oder live
    abweichend. Ein Apply schließt alle auf einmal — und für jedes künftige Projekt. Bereits
    bestehende Ressourcen, die gegen eine Policy verstoßen (z. B. eine VM mit externer IP), bleiben
    bestehen und sind in den Einzelmaßnahmen dieses Plans aufgeführt.
  satz: |
    cd {estate_repo}
    satz --config . whoami {estate_file}                       # läuft als {iac_sa}
    satz --config . merge-presets --report-only                 # Pack-Stand prüfen (CIS 2.6 oder neuer)
    satz --config . transpile {estate_file}
    satz --config . adopt {estate_file} --only google_org_policy_policy --execute --import   # vorab gesetzte Policies übernehmen
    cd hcl && tofu init -reconfigure && tofu plan               # erwartete Adds/Changes lesen
    tofu apply                                                  # Legacy→reset braucht ggf. -replace=<adresse>
    satz --config .. report-compliance cis-gcp-5.0 {estate_file}
  gcloud: |
    # Beispiel ohne satz: eine managed Constraint auf Org-Ebene setzen (je Policy eine Datei)
    cat > policy.yaml <<'Y'
    name: organizations/{org_id}/policies/compute.managed.requireOsLogin
    spec:
      rules:
      - enforce: true
    Y
    gcloud org-policies set-policy policy.yaml
  prereq:
    - "Legacy-Policies, die auf »reset« wechseln, lassen sich nicht in-place ändern (»Cannot set PolicyRules if reset is true«) — die betroffenen Adressen mit `tofu apply -replace=<adresse>` ersetzen."
    - Bereits live gesetzte Policies vor dem Apply importieren (adopt --import), sonst »already exists«.
  nachweis: "`satz report-compliance cis-gcp-5.0` zeigt die Kontrollen als verified; Prowler-Nachscan: {controls_line} → PASS."

- id: logging-foundation
  title: Logging-Fundament — Org-Audit-Sink und zentrales CIS-Alerting
  phase: kurzfristig
  kind: satz-pack
  controls: ["2.1", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8", "2.9", "2.10", "2.11", "2.12"]
  packs: [monitoring.organization_audit_logsink, monitoring.organization_cis_log_alerts_central]
  aufwand: "halber Tag (Projekt, Bucket, Sink, 8 Metriken + Alerts; Entscheidung zur Alert-Adresse)"
  risiko: "gering — nur neue Ressourcen in einem eigenen Logging-Projekt; Kosten für Log-Speicher (Audit-Logs, Retention {retention} Tage)"
  why: >-
    Ohne Org-Log-Sink und zentrales Alerting schlagen die Logging-Kontrollen in JEDEM Projekt an —
    hier in {n_projects} Projekten. Zwei Packs schließen sie zentral: der Org-Audit-Sink archiviert
    Admin-Activity-, Data-Access-, System-Event- und Policy-Logs aller Projekte in einen Bucket des
    Logging-Projekts (2.1, 2.3, 2.4); das zentrale Alerting legt die acht CIS-Log-Metriken mit
    Alert-Policies einmal auf Org-Ebene an (2.5–2.12). Prowler rechnet org-weites Alerting den
    Kindprojekten an — eine Maßnahme, alle Projekte.
  satz: |
    # im Estate ({estate_file}): das Logging-Projekt landet in dem Ordner, in dem `use` steht
    params {{
      logsink_project_name = "{log_project}"          # unveränderlich nach Anlage
      cis_central_email    = "gcp-security@{domain}"  # mail-fähige Gruppe, VORHER in Cloud Identity anlegen
    }}
    folder infra_folder {{
      use "presets/monitoring/organization-audit-logsink.satz"
      use "presets/monitoring/organization-cis-log-alerts-central.satz"
    }}
    # dann
    satz --config . transpile {estate_file} && cd hcl && tofu plan && tofu apply   # ein zweites Apply, falls das neue Projekt/API noch propagiert
  gcloud: |
    gcloud logging sinks create {shortcode}-organization-audit-gcs \
      storage.googleapis.com/{shortcode}-organization-audit-logs --organization={org_id} --include-children \
      --log-filter='log_id("cloudaudit.googleapis.com/activity") OR log_id("cloudaudit.googleapis.com/data_access") OR log_id("cloudaudit.googleapis.com/system_event") OR log_id("cloudaudit.googleapis.com/policy")'
    # Metrik + Alert je Kontrolle (Beispiel 2.5, Projektbesitz):
    gcloud logging metrics create cis-project-ownership-changes --project={log_project} \
      --description="CIS 2.5" --log-filter='(protoPayload.serviceName="cloudresourcemanager.googleapis.com") AND (ProjectOwnership OR projectOwnerInvitee) OR (protoPayload.serviceData.policyDelta.bindingDeltas.action="REMOVE" AND protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/owner") OR (protoPayload.serviceData.policyDelta.bindingDeltas.action="ADD" AND protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/owner")'
    gcloud alpha monitoring policies create --project={log_project} --notification-channels=<channel> --display-name="CIS 2.5" \
      --condition-filter='metric.type="logging.googleapis.com/user/cis-project-ownership-changes"' --condition-threshold-value=0 --condition-threshold-duration=300s
  prereq:
    - Mail-fähige Gruppe für die Alerts (cis_central_email) in Cloud Identity anlegen — Voraussetzung, nicht Folge.
    - Logging-API im Infra-Projekt aktiviert (sonst 403 beim Org-Sink).
    - Das Logging-Projekt braucht das Billing-Konto des Estates; die Projekt-ID ist unveränderlich.
  nachweis: "Prowler-Nachscan: 2.5–2.12 → PASS in allen Projekten; 2.1 → PASS auf Org-Ebene (Projektsicht bleibt ggf. als bekannter False Positive, Org-Vererbung); `satz report-compliance` → 2.3 verified."
  open_point: "Gruppenadresse für die CIS-Alerts (cis_central_email) benennen und in Cloud Identity anlegen."

- id: dns-logging
  title: Cloud DNS Logging für alle VPC-Netze
  phase: kurzfristig
  kind: gcloud
  controls: ["2.13"]
  aufwand: "15 Minuten je VPC"
  risiko: "gering — zusätzliche Log-Einträge (Kosten), keine Verhaltensänderung"
  why: >-
    DNS-Anfragen aus einer VPC werden nur mit einer DNS-Server-Policy protokolliert. Ohne Logging
    fehlt die Spur für Exfiltration über DNS und für die Aufklärung von Vorfällen.
  gcloud: |
    gcloud dns policies create dns-logging --networks=<vpc> --enable-logging --project=<projekt>
    # bestehende Policy: gcloud dns policies update <policy> --enable-logging --project=<projekt>
  terraform: |
    resource "google_dns_policy" "logging" {{
      name           = "dns-logging"
      enable_logging = true
      networks {{ network_url = google_compute_network.vpc.id }}
    }}
  nachweis: "`gcloud dns policies list --project=<projekt>` zeigt enableLogging: true je VPC; Prowler-Check logging_sink_created ist hier NICHT aussagekräftig (Prowler-Mapping-Lücke) — Nachweis per gcloud."

- id: cai-api
  title: Cloud Asset Inventory API aktivieren
  phase: kurzfristig
  kind: satz-pack
  controls: ["2.14"]
  aufwand: "Minuten je Projekt; als Projektvorlage einmalig"
  risiko: "keins"
  why: >-
    Cloud Asset Inventory ist die Grundlage für Bestandsaufnahme und Änderungshistorie — und die
    Datenquelle, aus der `satz report-compliance` Witnesses live verifiziert. In {n_projects}
    Projekten ist die API nicht aktiv. Für eigene Projekte gehört sie in die Projektdeklaration des
    Estates; für generierte Projekte in die Vorlage, aus der sie entstehen.
  satz: |
    # je Projekt im Estate: google_project_service (auto_explode ist in config.toml aktiv)
    google_project_service {{
      cai {{ project = "<projekt>"  service = "cloudasset.googleapis.com" }}
    }}
  gcloud: |
    for P in {projects}; do gcloud services enable cloudasset.googleapis.com --project=$P; done
  nachweis: "`gcloud services list --enabled --project=<projekt> | grep cloudasset`; Prowler-Nachscan 2.14 → PASS."

- id: access-transparency-approval
  title: Access Transparency und Access Approval
  phase: nach_freigabe
  kind: decision
  controls: ["2.15", "2.16"]
  aufwand: "Entscheidung + Support-Vertrag; technisch Minuten"
  risiko: "keins technisch; Access Approval kann Google-Support-Zugriffe verzögern"
  why: >-
    Access Transparency protokolliert Zugriffe von Google-Personal auf Kundendaten, Access Approval
    macht sie genehmigungspflichtig. Beides setzt eine Support-Stufe (Enhanced/Premium) voraus; ohne
    sie ist die Kontrolle nicht erfüllbar — das ist eine Vertrags-, keine Konfigurationsfrage.
  gcloud: |
    gcloud access-approval settings update --organization={org_id} --enrolled_services=all --notification_emails=<security-mail>
  nachweis: "`gcloud access-approval settings get --organization={org_id}`; Access Transparency in der Konsole unter IAM & Admin → Settings."
  open_point: "Support-Stufe klären — Access Transparency / Access Approval sind ohne Enhanced/Premium Support nicht aktivierbar."

- id: lb-logging
  title: Logging für HTTP(S)-Load-Balancer
  phase: kurzfristig
  kind: gcloud
  controls: ["2.17"]
  aufwand: "Minuten je Backend-Service"
  risiko: "gering — Log-Volumen (Sample-Rate steuerbar)"
  why: >-
    Ohne Backend-Logging fehlen Request-Logs des Load-Balancers für Angriffserkennung und Forensik.
  gcloud: |
    gcloud compute backend-services update <backend> --global --enable-logging --logging-sample-rate=1.0 --project=<projekt>
  terraform: |
    resource "google_compute_backend_service" "b" {{
      log_config {{ enable = true  sample_rate = 1.0 }}
    }}
  nachweis: "Prowler-Nachscan 2.17 → PASS; `gcloud compute backend-services describe <backend> --global` zeigt logConfig.enable: true."

- id: sa-hygiene
  title: Service-Accounts — Schlüssel, Privilegien, Rollenvergabe
  phase: kurzfristig
  kind: gcloud
  controls: ["1.5", "1.6", "1.7", "1.8", "1.9", "1.12"]
  aufwand: "Klärung mit den Owner-Teams (Konsumenten der Schlüssel); technisch Minuten je SA"
  risiko: "mittel — ein gelöschter Schlüssel bricht den Konsumenten, der ihn nutzt; erst inventarisieren, dann rotieren"
  why: >-
    Nutzerverwaltete Schlüssel sind Langzeit-Credentials außerhalb der Plattform; Admin-Rollen auf
    Service-Accounts und Service-Account-User/Token-Creator auf Projektebene erlauben
    Rechteausweitung; KMS-Rollen auf derselben Identität heben die Funktionstrennung auf. Die
    Org-Policy gegen neue Schlüssel (Pack) verhindert Neuanlagen — Bestand muss von Hand weg.
  gcloud: |
    # Inventar: alle nutzerverwalteten Schlüssel
    for P in {projects}; do for SA in $(gcloud iam service-accounts list --project=$P --format='value(email)'); do
      gcloud iam service-accounts keys list --iam-account=$SA --managed-by=user --format='table(name,validAfterTime)'; done; done
    # Ersatz: Workload Identity Federation / Impersonation statt Schlüssel; dann
    gcloud iam service-accounts keys delete <key-id> --iam-account=<sa>
    # Admin-Rollen auf SAs entfernen, projektweite SA-User-Rollen auf die SA-Ressource verlagern
    gcloud projects remove-iam-policy-binding <projekt> --member=serviceAccount:<sa> --role=roles/owner
    gcloud iam service-accounts add-iam-policy-binding <ziel-sa> --member=user:<person> --role=roles/iam.serviceAccountUser
  prereq:
    - "Owner der betroffenen Service-Accounts benennen; Konsumenten der Schlüssel identifizieren (Logs: `protoPayload.authenticationInfo.serviceAccountKeyName`)."
  nachweis: "Prowler-Nachscan 1.5–1.8 → PASS; `gcloud iam service-accounts keys list --managed-by=user` leer."
  open_point: "Owner der Service-Accounts mit nutzerverwalteten Schlüsseln benennen und Ablösung (WIF/Impersonation) terminieren."

- id: kms-keys
  title: Cloud KMS — Zugriff und Rotation
  phase: kurzfristig
  kind: gcloud
  controls: ["1.10", "1.11"]
  packs: [cis_extensions.cmek]
  aufwand: "Minuten je Schlüssel"
  risiko: "gering — Rotation erzeugt neue Versionen, alte bleiben zum Entschlüsseln"
  why: >-
    Öffentlich lesbare KMS-Schlüssel und Schlüssel ohne Rotation sind direkte Kryptorisiken.
  gcloud: |
    gcloud kms keys remove-iam-policy-binding <key> --keyring=<ring> --location=<loc> --member=allUsers --role=<rolle>
    gcloud kms keys update <key> --keyring=<ring> --location=<loc> --rotation-period=90d --next-rotation-time=$(date -u -v+1d +%Y-%m-%dT%H:%M:%SZ)
  nachweis: "Prowler-Nachscan 1.10/1.11 → PASS."

- id: api-keys
  title: API-Schlüssel — Bestand, Einschränkung, Rotation
  phase: kurzfristig
  kind: satz-pack
  controls: ["1.13", "1.14", "1.15", "1.16"]
  packs: [cis_extensions.api_key_services]
  aufwand: "Stunden (Inventar, Ersatz durch OAuth/SA wo möglich)"
  risiko: "mittel — ein eingeschränkter oder gelöschter Schlüssel bricht die App, die ihn nutzt"
  why: >-
    API-Schlüssel sind Bearer-Credentials ohne Identität. Wo sie unvermeidbar sind, müssen sie auf
    Hosts/Apps (1.14) und APIs (1.15) beschränkt und rotiert werden (1.16); ungenutzte weg (1.13).
    Das Pack api-key-services setzt die Org-Policy für erlaubte API-Ziele.
  satz: |
    use "presets/cis-extensions/api-key-services.satz"
  gcloud: |
    gcloud services api-keys list --project=<projekt>
    gcloud services api-keys update <key> --api-target=service=<api> --allowed-referrers=<host>
    gcloud services api-keys delete <key>
  nachweis: "Prowler-Nachscan 1.13/1.15/1.16 → PASS; 1.14 per Stichprobe (Konsole → APIs & Services → Credentials)."

- id: essential-contacts
  title: Essential Contacts auf Organisationsebene
  phase: sofort
  kind: satz-pack
  controls: ["1.17"]
  packs: [essential_contacts_organization]
  aufwand: "15 Minuten"
  risiko: "keins"
  why: >-
    Google adressiert Sicherheits-, Rechts- und Abrechnungshinweise an Essential Contacts; ohne sie
    gehen sie an den Projekt-Owner oder ins Leere.
  satz: |
    use "presets/essential-contacts-organization.satz"   # Kategorien je Param (security, legal, billing, …)
  gcloud: |
    gcloud essential-contacts create --email=<security-mail> --notification-categories=SECURITY,TECHNICAL,LEGAL,BILLING,SUSPENSION --organization={org_id}
  nachweis: "`gcloud essential-contacts list --organization={org_id}`; Prowler-Nachscan 1.17 → PASS."

- id: secrets-in-functions
  title: Secrets in Cloud-Functions-Umgebungsvariablen
  phase: review
  kind: review
  controls: ["1.18"]
  aufwand: "Stichprobe je Funktion"
  risiko: "keins"
  why: >-
    Umgebungsvariablen sind für jeden mit Lese-Recht auf die Funktion sichtbar; Secrets gehören in
    Secret Manager und werden zur Laufzeit gemountet.
  gcloud: |
    gcloud functions list --format='value(name,environmentVariables)' --project=<projekt>
    gcloud functions deploy <fn> --set-secrets=API_KEY=<secret>:latest
  nachweis: "Stichprobe: keine Werte mit Schlüssel-/Passwort-Charakter in environmentVariables."

- id: identity-governance
  title: Identitäten — Super-Admin, Corporate Login, MFA, Security Keys, Datenfreigabe
  phase: review
  kind: review
  controls: ["1.1.1", "1.1.2", "1.1.3", "1.2", "1.3", "1.4", "2.2"]
  aufwand: "CISO-Review mit dem Workspace-/Cloud-Identity-Admin; 1–2 Stunden"
  risiko: "keins technisch; 2-Schritt-Pflicht kann Nutzer aussperren — mit Vorlauf ankündigen"
  why: >-
    Diese Kontrollen leben in Google Workspace / Cloud Identity, nicht in Google Cloud: Super-Admin
    als Rollenpostfach ohne Cloud-Rollen (1.1.1/1.1.2), Ordnerstruktur nach Umgebung und
    Schutzbedarf (1.1.3), nur Unternehmens-Identitäten (1.2 — die Org-Policy Domain Restricted
    Sharing ist der technische Teil, die Admin-Konsole der organisatorische), 2-Schritt-Verifizierung
    für alle (1.3), Security Keys für Admins (1.4), Datenfreigabe Workspace → Cloud (2.2). Prowler
    prüft sie nicht; Nachweis per Admin-Konsole und Stichprobe.
  gcloud: |
    # Cloud-Rollen von Super-Admins finden
    gcloud organizations get-iam-policy {org_id} --flatten='bindings[].members' --format='table(bindings.role,bindings.members)' | grep -i admin
    # Admin-Konsole: Sicherheit → Authentifizierung → 2-Schritt-Verifizierung (Erzwingung, Security Keys für Admins)
    # Admin-Konsole: Konto → Kontoeinstellungen → Legacy → Datenfreigabe mit Google Cloud
  nachweis: "Screenshots/Exports der Admin-Konsole in der Audit-Akte; IAM-Export der Org-Ebene."

- id: dnssec
  title: DNSSEC für Cloud-DNS-Zonen
  phase: kurzfristig
  kind: gcloud
  controls: ["3.3", "3.4", "3.5"]
  aufwand: "Minuten je Zone; DS-Record beim Registrar nachziehen"
  risiko: "mittel — ein fehlerhafter DS-Record beim Registrar macht die Zone unauflösbar; erst signieren, dann DS eintragen, dann prüfen"
  why: >-
    Ohne DNSSEC sind die Zonen des Kunden gegen Cache-Poisoning ungeschützt; RSASHA1 gilt als
    gebrochen und darf weder für KSK noch ZSK verwendet werden.
  gcloud: |
    gcloud dns managed-zones update <zone> --dnssec-state=on --ksk-algorithm=rsasha256 --ksk-key-length=2048 --zsk-algorithm=rsasha256 --zsk-key-length=1024 --project=<projekt>
    gcloud dns dns-keys list --zone=<zone> --project=<projekt>   # DS-Record → Registrar
  terraform: |
    resource "google_dns_managed_zone" "z" {{
      dnssec_config {{ state = "on" }}
    }}
  nachweis: "Prowler-Nachscan 3.3–3.5 → PASS; `dig +dnssec <domain>` liefert RRSIG."

- id: network-exposure
  title: Netzwerk — Default-/Legacy-Netze, SSH/RDP aus dem Internet
  phase: kurzfristig
  kind: gcloud
  controls: ["3.1", "3.2", "3.6", "3.7"]
  packs: [CIS_GCP_Foundation_4_0]
  aufwand: "Stunden (Firewall-Review je Projekt)"
  risiko: "mittel — eine entfernte Regel kann Admin-Zugang kappen; IAP-TCP-Forwarding vorher einrichten"
  why: >-
    Das Default-Netz bringt offene Firewall-Regeln mit; Legacy-Netze kennen keine Subnetze und keine
    Flow Logs; SSH/RDP von 0.0.0.0/0 sind die häufigste Einbruchsroute. Die Org-Policy
    skipDefaultNetworkCreation (Pack) verhindert neue Default-Netze — Bestand wird gelöscht.
  gcloud: |
    gcloud compute networks delete default --project=<projekt>
    gcloud compute firewall-rules list --project=<projekt> --filter='sourceRanges:0.0.0.0/0 AND allowed.ports:(22 OR 3389)'
    gcloud compute firewall-rules update <regel> --source-ranges=35.235.240.0/20   # IAP-Bereich statt Internet
  nachweis: "Prowler-Nachscan 3.1/3.2/3.6/3.7 → PASS."

- id: vpc-sc-psc
  title: VPC Service Controls und Private Service Connect
  phase: nach_freigabe
  kind: decision
  controls: ["3.8", "3.9"]
  aufwand: "Tage (Perimeter-Design, Ausnahmen, Dry-Run-Phase)"
  risiko: "hoch — ein falsch geschnittener Perimeter blockiert legitime Zugriffe; immer erst im Dry-Run-Modus"
  why: >-
    VPC Service Controls begrenzen Datenabfluss über Google-APIs auf einen Perimeter; Private
    Service Connect hält den API-Verkehr im privaten Netz. Beides ist Architektur, keine Einstellung —
    Entscheidung mit dem Kunden, dann Design.
  gcloud: |
    gcloud access-context-manager perimeters dry-run create <perimeter> --policy=<policy> --resources=projects/<nr> --restricted-services=storage.googleapis.com
    gcloud compute addresses create psc-apis --global --purpose=PRIVATE_SERVICE_CONNECT --addresses=<ip> --network=<vpc>
    gcloud compute forwarding-rules create psc-apis --global --network=<vpc> --address=psc-apis --target-google-apis-bundle=all-apis
  nachweis: "Perimeter im Dry-Run ohne Violations über 2 Wochen, dann Enforce; Konsole → Security → VPC Service Controls."
  open_point: "VPC Service Controls / Private Service Connect — Bedarf und Perimeter-Schnitt mit dem Kunden entscheiden."

- id: flow-logs
  title: VPC Flow Logs auf allen Subnetzen
  phase: kurzfristig
  kind: gcloud
  controls: ["3.10"]
  packs: [CIS_GCP_Foundation_4_0]
  aufwand: "Minuten je Subnetz"
  risiko: "gering — Log-Volumen (Sampling 0.5, Aggregation 5 s als Kompromiss)"
  why: >-
    Flow Logs sind die Netzwerk-Forensik: ohne sie ist nach einem Vorfall nicht rekonstruierbar,
    wer mit wem gesprochen hat.
  gcloud: |
    gcloud compute networks subnets update <subnetz> --region=<region> --enable-flow-logs --logging-aggregation-interval=interval-5-sec --logging-flow-sampling=0.5 --logging-metadata=include-all --project=<projekt>
  terraform: |
    resource "google_compute_subnetwork" "s" {{
      log_config {{ aggregation_interval = "INTERVAL_5_SEC"  flow_sampling = 0.5  metadata = "INCLUDE_ALL_METADATA" }}
    }}
  nachweis: "Prowler-Nachscan 3.10 → PASS."

- id: lb-tls-iap
  title: Load-Balancer — SSL-Policies und Identity-Aware Proxy
  phase: review
  kind: review
  controls: ["3.11", "3.12"]
  aufwand: "Review je Load-Balancer"
  risiko: "gering — eine strengere SSL-Policy kann alte Clients ausschließen"
  why: >-
    Schwache Cipher-Suites (TLS < 1.2, Default-Policy) und direkt erreichbare Backends ohne IAP
    sind Angriffsfläche am Rand; beides prüft Prowler nicht automatisiert.
  gcloud: |
    gcloud compute ssl-policies create tls12-modern --profile=MODERN --min-tls-version=1.2
    gcloud compute target-https-proxies update <proxy> --ssl-policy=tls12-modern
    gcloud compute backend-services update <backend> --global --iap=enabled,oauth2-client-id=<id>,oauth2-client-secret=<secret>
  nachweis: "`gcloud compute target-https-proxies list --format='table(name,sslPolicy)'` — keine Proxies ohne Policy."

- id: vm-hardening
  title: Compute-Instanzen — Service-Account, SSH-Keys, Shielded/Confidential VM, CSEK
  phase: kurzfristig
  kind: satz-pack
  controls: ["4.1", "4.2", "4.3", "4.7", "4.8", "4.11"]
  packs: [cis_extensions.block_project_ssh_keys, cis_extensions.shielded_vm, cis_extensions.confidential_computing]
  aufwand: "Stunden (VM-Neustart nötig für Shielded/Confidential, SA-Wechsel)"
  risiko: "mittel — SA-Wechsel und Neustart betreffen laufende Workloads; im Wartungsfenster"
  why: >-
    Der Default-Compute-SA ist Editor im Projekt (4.1/4.2); projektweite SSH-Keys gelten für jede VM
    (4.3); Shielded VM (4.8) und Confidential Computing (4.11) sind Boot- bzw.
    Speicher-Integrität; CSEK (4.7) ist nur für ausgewählte kritische VMs sinnvoll (Schlüsselverlust =
    Datenverlust). Die drei Erweiterungs-Packs setzen Org-Policies für neue VMs; Bestand von Hand.
  satz: |
    use "presets/cis-extensions/block-project-ssh-keys.satz"
    use "presets/cis-extensions/shielded-vm.satz"
    use "presets/cis-extensions/confidential-computing.satz"   # nur, wenn alle VM-Typen es unterstützen
  gcloud: |
    gcloud compute instances set-service-account <vm> --zone=<zone> --service-account=<dedizierter-sa> --scopes=cloud-platform
    gcloud compute instances add-metadata <vm> --zone=<zone> --metadata=block-project-ssh-keys=true
    gcloud compute instances stop <vm> --zone=<zone> && gcloud compute instances update <vm> --zone=<zone> --shielded-secure-boot --shielded-vtpm --shielded-integrity-monitoring && gcloud compute instances start <vm> --zone=<zone>
  nachweis: "Prowler-Nachscan 4.1–4.3, 4.8, 4.11 → PASS; 4.7 nach Entscheidung je kritischer VM."

- id: vm-manual
  title: App Engine HTTPS und Betriebssystem-Updates
  phase: review
  kind: review
  controls: ["4.10", "4.12"]
  aufwand: "Stichprobe"
  risiko: "keins"
  why: >-
    App-Engine-Handler müssen HTTPS erzwingen (secure: always); VM-Patchstand ist Betriebsaufgabe
    (OS Config / VM Manager) — beides prüft Prowler nicht.
  gcloud: |
    gcloud app describe --project=<projekt>; grep -n "secure:" app.yaml
    gcloud compute os-config patch-jobs list --project=<projekt>
    gcloud compute os-config patch-deployments create weekly --file=patch.yaml --project=<projekt>
  nachweis: "app.yaml mit secure: always; Patch-Deployment mit Zeitplan vorhanden."

- id: bucket-lock
  title: Bucket Lock auf dem Log-Archiv (unwiderruflich)
  phase: nach_freigabe
  kind: decision
  controls: ["2.3", "2.4"]
  packs: [cis_extensions.bucket_retention]
  aufwand: "Minuten — nach verbindlicher Entscheidung zur Aufbewahrungsdauer"
  risiko: "hoch im Sinne von unumkehrbar — eine gesperrte Retention kann nur verlängert, nie verkürzt werden; Bucket nicht löschbar vor Ablauf"
  why: >-
    Erst der Lock macht das Log-Archiv manipulationssicher (2.4). Er ist eine Einbahnstraße und
    deshalb eine Entscheidung des Kunden, nicht des Betriebs. Das Pack bucket-retention setzt die
    Retention; der Lock selbst ist ein bewusster Handgriff.
  satz: |
    use "presets/cis-extensions/bucket-retention.satz"   # Retention (Default 400 Tage) auf dem Archiv-Bucket
  gcloud: |
    gcloud storage buckets update gs://{shortcode}-organization-audit-logs --retention-period=400d
    gcloud storage buckets update gs://{shortcode}-organization-audit-logs --lock-retention-period   # unwiderruflich
  prereq:
    - Logging-Fundament (Org-Sink + Bucket) vorhanden.
    - Aufbewahrungsdauer schriftlich freigegeben.
  nachweis: "Prowler-Nachscan 2.3/2.4 → PASS; `gcloud storage buckets describe gs://<bucket> --format='value(retentionPolicy.isLocked)'` = True."
  open_point: "Bucket Lock: Aufbewahrungsdauer verbindlich festlegen (Vorschlag 400 Tage) und Sperre freigeben oder bewusst zurückstellen."

- id: cloud-sql
  title: Cloud SQL — Zugriff, TLS, Backups, Datenbank-Flags
  phase: kurzfristig
  kind: satz-pack
  controls: ["6.1.1", "6.1.2", "6.1.3", "6.2.1", "6.2.2", "6.2.3", "6.2.4", "6.2.5", "6.2.6", "6.2.7", "6.2.8", "6.3.1", "6.3.2", "6.3.3", "6.3.4", "6.3.5", "6.3.6", "6.3.7", "6.4", "6.5", "6.6", "6.7", "6.8", "6.9"]
  packs: [cis_extensions.cloud_sql]
  aufwand: "Stunden je Instanz (Flags erfordern Neustart)"
  risiko: "mittel — Flag-Änderungen und TLS-Pflicht betreffen Verbindungen der Anwendung; im Wartungsfenster"
  why: >-
    Öffentliche IPs und 0.0.0.0/0-Autorisierungen (6.5/6.7) sind die kritischen Punkte; TLS-Pflicht
    (6.4), Backups (6.8), Löschschutz (6.9), IAM-Authentifizierung (6.6) und die engine-spezifischen
    Logging-/Härtungs-Flags (6.1.x MySQL, 6.2.x PostgreSQL, 6.3.x SQL Server) folgen. Das Pack
    cloud-sql setzt die Org-Policies gegen öffentliche IPs und für CMEK-freie Defaults.
  satz: |
    use "presets/cis-extensions/cloud-sql.satz"
  gcloud: |
    gcloud sql instances patch <instanz> --no-assign-ip --require-ssl --backup-start-time=02:00 --deletion-protection --project=<projekt>
    gcloud sql instances patch <instanz> --database-flags=log_connections=on,log_disconnections=on,log_min_messages=warning,log_min_error_statement=error,cloudsql.enable_pgaudit=on   # PostgreSQL
    gcloud sql instances patch <instanz> --database-flags=skip_show_database=on,local_infile=off                                   # MySQL
    gcloud sql instances patch <instanz> --database-flags="external scripts enabled=off,cross db ownership chaining=off,remote access=off,contained database authentication=off"   # SQL Server
  nachweis: "Prowler-Nachscan §6 → PASS; 6.1.1/6.6/6.9 per `gcloud sql users list` bzw. `gcloud sql instances describe`."

- id: bigquery
  title: BigQuery — Zugriff, CMEK, Klassifizierung
  phase: kurzfristig
  kind: satz-pack
  controls: ["7.1", "7.2", "7.3", "7.4"]
  packs: [cis_extensions.cmek]
  aufwand: "Stunden (CMEK-Umzug = Tabellen kopieren)"
  risiko: "mittel — CMEK auf bestehenden Tabellen erfordert Kopie; Schlüsselverlust = Datenverlust"
  why: >-
    Öffentliche Datasets (7.1) sind Datenabfluss; CMEK (7.2/7.3) ist Schlüsselhoheit; die
    Klassifizierung (7.4, Data Catalog / Sensitive Data Protection) ist Voraussetzung, um
    Schutzbedarf überhaupt zuzuordnen.
  satz: |
    use "presets/cis-extensions/cmek.satz"   # Org-Policy: CMEK-Pflicht für BigQuery/Dataproc
  gcloud: |
    bq show --format=prettyjson <projekt>:<dataset> | grep -A3 allAuthenticatedUsers
    bq update --default_kms_key=projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k> <projekt>:<dataset>
  nachweis: "Prowler-Nachscan 7.1–7.3 → PASS; 7.4 per Data-Catalog-Tags in der Stichprobe."

- id: dataproc
  title: Dataproc-Cluster mit CMEK
  phase: kurzfristig
  kind: satz-pack
  controls: ["8.1"]
  packs: [cis_extensions.cmek]
  aufwand: "Cluster-Neuanlage (CMEK nur bei Erstellung)"
  risiko: "mittel — Neuanlage der Cluster"
  why: >-
    Dataproc-Cluster-Disks lassen sich nur bei der Anlage mit CMEK verschlüsseln; die Org-Policy des
    cmek-Packs erzwingt es für künftige Cluster.
  satz: |
    use "presets/cis-extensions/cmek.satz"
  gcloud: |
    gcloud dataproc clusters create <cluster> --region=<region> --gce-pd-kms-key=projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>
  nachweis: "Prowler-Nachscan 8.1 → PASS (Dataproc-Scan je Projekt, nicht org-weit — Werkzeuggrenze)."

- id: fleet-lifecycle
  title: Generierte Projekte — Vorlage und Lebenszyklus
  phase: nach_freigabe
  kind: decision
  controls: []          # bekommt zur Laufzeit die Kontrollen, die in Flotten-Projekten FAIL sind
  fleet_only: true
  aufwand: "Entscheidung + Anpassung der Projektfabrik"
  risiko: "gering — Ablaufdatum betrifft nur Testprojekte; Bestand wird nicht angefasst"
  why: >-
    Die {n_fleet} {fleet_label} zeigen in jeder Kontrolle dasselbe Bild. Nach
    dem Logging-Fundament sind sie für die Logging-Kontrollen abgedeckt, ohne dass jemand sie
    anfasst. Was bleibt (CAI-API, Container-Scanning), gehört in die Vorlage, aus der diese Projekte
    entstehen — nicht in eine Schleife über den Bestand. Und die Frage an den Kunden: sollen
    {n_fleet} Testprojekte dauerhaft bestehen? Jedes ist Angriffsfläche und Kostenstelle; ein
    Ablaufdatum in der Fabrik löst mehr Befunde als jede Remediation.
  gcloud: |
    gcloud projects list --filter='projectId~"{fleet_regex}"' --format='table(projectId,createTime)'
    # Vorlage: cloudasset.googleapis.com aktivieren, Label expiry=<datum>, Löschung per Scheduler
  nachweis: "Prowler-Nachscan: Flotten-Projekte ohne FAIL oder außerhalb des Bestands."
  open_point: "Lebenszyklus der {n_fleet} generierten Projekte: Ablaufdatum in der Projektfabrik oder bewusste Entscheidung für den Bestand."

- id: audit-identity
  title: Audit-Identität für künftige Scans
  phase: laufend
  kind: satz-pack
  controls: []
  always: true
  packs: [sa_security_audit]
  aufwand: "15 Minuten"
  risiko: "keins — read-only Service-Account"
  why: >-
    Dieser Scan lief als IaC-Service-Account des Estates — eine Schreib-Identität für eine Leseaufgabe.
    Das Pack sa-security-audit legt einen read-only Audit-Service-Account an (Impersonation, keine
    Schlüssel), mit dem Prowler und report-compliance künftig laufen.
  satz: |
    use "presets/security-audit/sa-security-audit.satz"
  nachweis: "`prowler gcp --impersonate-service-account svc-security-audit@{infra_project}.iam.gserviceaccount.com …` läuft ohne Schreibrechte."
  open_point: "Audit-Identität: Pack security-audit/sa-security-audit anlegen — heute läuft der Scan als IaC-Account."
