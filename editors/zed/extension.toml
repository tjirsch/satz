id = "satz"
name = "Satz"
version = "0.1.0"
schema_version = 1
authors = ["tjirsch"]
description = "Syntax highlighting, outline, brackets and indentation for Satz estates and packs"
repository = "https://github.com/tjirsch/satz"

# Zed clones this repository at `rev` and compiles src/parser.c to WebAssembly
# itself. A language change is a grammar commit first, then a bump here. For
# grammar work in progress, point `repository` at a local checkout:
# "file:///…/satz-tree-sitter".
[grammars.satz]
repository = "https://github.com/tjirsch/satz-tree-sitter"
rev = "3306011fabf98180ec2db1736ac9720f4e4b2094"

# The language server is the satz binary itself: `satz lsp`, found on the PATH
# by src/lib.rs, or `lsp.satz.binary.path` in Zed's settings.
[language_servers.satz]
name = "satz"
languages = ["Satz"]
