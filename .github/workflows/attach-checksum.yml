name: Attach Checksum to Release

# cargo-dist post-announce job (dist-workspace.toml: post-announce-jobs). It
# runs inside the Release workflow, after the GitHub release exists, so the
# sidecar is attached in the same run — no workflow_run chaining, no window
# in which the release is visible but unverifiable.
#
# satz self-update fetches and verifies this sidecar before executing the
# installer — if the file is absent, self-update aborts.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  attach-checksum:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download installer from release
        run: gh release download "$TAG" --pattern "satz-installer.sh" --repo "$GITHUB_REPOSITORY"

      - name: Generate SHA-256 sidecar
        run: sha256sum satz-installer.sh > satz-installer.sh.sha256

      - name: Upload sidecar to release
        run: gh release upload "$TAG" satz-installer.sh.sha256 --clobber --repo "$GITHUB_REPOSITORY"
