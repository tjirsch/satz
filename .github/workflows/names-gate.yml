name: privacy gate

# Public repository. Neutral gate — no customer, company or person is named
# in it. Rejects anything shaped like private data that is not a documented
# example value (docs/examples.md), a domain that is neither
# IANA-reserved nor a known vendor host, and any commit not authored under the
# maintainer identity or a GitHub noreply address. Runs once per commit: on a
# pull request, and on the push to main that merges it or bumps the release — a
# branch push alone is judged by its pull request. A newer push to a pull request
# cancels the run it supersedes; a run on main is never cancelled or queued.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: whole tree
        run: bash scripts/check-names.sh
      - name: commit identities and messages in this pull request / push to main
        # Only the commits this event ADDS are judged — never history that
        # predates the rule. A pull request: what it adds over its base, however
        # often it was rebased and force-pushed. A push to main: before..sha, the
        # squash commit that merged a pull request or the release's version bump;
        # the first push to main: HEAD.
        #
        # `before` is checked for EXISTENCE, not merely for not being all-zeros: a
        # range that cannot be resolved would check nothing, and a gate that
        # passes what it did not check is how a privacy gate starts lying. main is
        # never force-pushed, so an unresolvable `before` is a fault, and the gate
        # refuses it rather than judging less.
        run: |
          zero=0000000000000000000000000000000000000000
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ -z "$before" ] || [ "$before" = "$zero" ]; then
            range="HEAD"
          elif git rev-parse -q --verify "$before^{commit}" >/dev/null; then
            range="$before..${{ github.sha }}"
          else
            echo "names-gate: $before, the main this push replaced, does not resolve — main was force-pushed" >&2
            exit 1
          fi
          echo "range: $range"
          bash scripts/check-names.sh --commits "$range"
