name: Prune Run Artifacts

# cargo-dist post-announce job (dist-workspace.toml: post-announce-jobs). It runs
# inside the Release workflow, after the release exists, and deletes the artifacts
# THIS run uploaded.
#
# Those artifacts are cargo-dist's transport between its own jobs, and nothing else:
# `build-local-artifacts` uploads each target's build, `build-global-artifacts`
# downloads them all to make the installers and uploads those, and `host` downloads
# everything again to attach it to the release. Once the release exists the release
# itself holds every file that matters — release assets do not count against the
# Actions storage quota, and these copies do.
#
# Left alone they sit for the default 90 days: a full multi-platform payload per
# release, which is how a 500 MB quota dies in four releases and every workflow in
# the account starts failing on artifact upload. `retention-days` cannot be set on
# those uploads instead, because they are steps of `release.yml`, which cargo-dist
# generates from `dist-workspace.toml`: the line would be overwritten by the next
# `dist generate`, and the `release-workflow` job of `smoke.yml` fails any commit
# whose `release.yml` differs from what `dist generate` produces.
#
# A FAILED release keeps its artifacts: the job only runs once the announce step has,
# so a run that broke halfway is still there to debug. Delete those by hand, or
# re-run the release and this job takes them with it.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  prune-artifacts:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete this run's artifacts
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --paginate --jq '.artifacts[] | "\(.id) \(.size_in_bytes) \(.name)"' > artifacts.txt
          total=0
          while read -r id size name; do
            [ -z "${id:-}" ] && continue
            echo "deleting $name ($size bytes)"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            total=$((total + size))
          done < artifacts.txt
          echo "freed $total bytes; the release keeps its own copy of every published file"
