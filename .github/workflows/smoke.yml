name: smoke

# Every estate-consuming command end to end against tests/smoke/ — the
# commands, not just the engines. Offline: no ADC, no org.
#
# Once per commit: on a pull request, and on the push to main that merges it
# (the squash commit, or the release's version bump). A branch push alone runs
# nothing — its pull request runs the same jobs on the branch merged into main —
# and a release tag runs nothing, because it tags a commit main already tested.
#
# A newer push to a pull request cancels the run it supersedes. A run on main is
# never cancelled and never queued behind another: its group is the run itself,
# since its result is the check of what merged.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  grammar:
    name: grammar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: the grammar models every statement, and every Satz file parses with it
        run: bash scripts/check-grammar.sh
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
      # Last in this job, where the crate sources and the cargo cache already are. The
      # script reads the licence files out of the unpacked sources and runs offline,
      # so `cargo fetch` first: a Linux build unpacks what Linux compiles, and the
      # file also covers the crates only Windows and macOS pull in. The cargo-about
      # version comes from the script, which refuses any other one — a different one
      # can read a licence file differently, and the file would then differ between a
      # machine and CI with nothing in the repository having changed.
      - uses: cargo-bins/cargo-binstall@main
      - name: third-party licence texts match Cargo.lock
        run: |
          cargo binstall -y --locked "cargo-about@$(sed -n 's/^WANT=//p' scripts/update-third-party-licenses.sh)"
          cargo fetch --locked
          bash scripts/update-third-party-licenses.sh --check
  release-workflow:
    # `.github/workflows/release.yml` is generated from `dist-workspace.toml` by
    # cargo-dist, so a hand edit to it is a change nothing else would notice until a
    # release runs. The gate cannot live in `release.yml` itself — it would be
    # regenerated away — and it is its own job rather than a step in `checks`, so a
    # stale workflow file reads as a stale workflow file and `checks` stays the
    # verdict on the code.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the version `dist-workspace.toml` pins, installed the way release.yml's own
      # `plan` job installs it: another version generates the file differently, and
      # reading the pin here is what keeps the two from drifting apart
      - name: install dist
        shell: bash
        run: |
          want=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          echo "dist $want"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$want/cargo-dist-installer.sh" | sh
      - name: release.yml is what dist-workspace.toml generates
        shell: bash
        run: |
          if ! dist generate --check; then
            want=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
            echo "::error file=.github/workflows/release.yml::.github/workflows/release.yml is not what dist-workspace.toml generates. Install cargo-dist $want (dist selfupdate, or the installer this job runs), run 'dist generate', and commit the result. The file is generated: edit dist-workspace.toml, never release.yml. Ignore the 'run dist init' hint above — init rewrites dist-workspace.toml."
            exit 1
          fi
  windows-checks:
    # the same two gates on Windows: satz ships a Windows build, so clippy and the tests
    # run there on every pull request and push to main — the smoke matrix is bash and
    # stays on Linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      # setup-uv publishes no moving major tag since v8: an exact release is the
      # reference upstream documents, and it is bumped by hand.
      # The cache is off — this repository has no dependency file for the cache key
      # to read, so the key would never change and the cache would never invalidate.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: build
        run: cargo build --release --quiet --locked
      # every `tofu init` in the matrix reads the providers from this cache
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tofu-plugins
          key: tofu-plugins-${{ runner.os }}-${{ hashFiles('tests/smoke/config.toml', 'tests/smoke/tf/**') }}
      - name: smoke matrix
        # the checks job runs cargo test on the same commit
        env:
          SMOKE_SKIP_CARGO_TEST: "1"
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugins
        run: bash scripts/smoke.sh
