name: smoke

# Every estate-consuming command end to end against tests/smoke/ — the
# commands, not just the engines. Offline: no ADC, no org.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: build
        run: cargo build --release --quiet
      - name: smoke matrix
        run: bash scripts/smoke.sh
