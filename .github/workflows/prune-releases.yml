name: Prune Old Releases

# Runs after each successful Release workflow and deletes all but the 5
# most recent releases (and their git tags).
#
# Uses workflow_run for the same reason as attach-checksum.yml — cargo-dist
# creates releases with GITHUB_TOKEN, so release:published never fires.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  prune:
    # Only a successful TAG PUSH release. The Release workflow also runs on
    # pull_request, where head_branch is the branch NAME — a PR from a branch
    # called `v2-rework` used to reach this job and delete releases and tags.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete releases beyond the 5 most recent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$HEAD_BRANCH" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release tag: $HEAD_BRANCH"; exit 0 ;;
          esac
          gh release list --repo "$REPO" --limit 100 --json tagName \
            --jq '.[5:][].tagName' \
          | xargs -r -I{} gh release delete {} \
              --repo "$REPO" \
              --yes \
              --cleanup-tag
