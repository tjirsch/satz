# The project `shop-dev`, an instance of the template beside it (examples/acme/project-template/)
# the Satz way: this estate binds the template's inputs and uses the template. Paths resolve
# against this file's directory; `include_dirs` reaches the template.
yaml_dir = "satz"
hcl_dir = "hcl"
interfaces_dir = "interfaces"
include_dirs = [".", "satz", "../project-template/satz"]
schema_dir = "../../../tests/schemas"
presets_dir = "../../../presets"
tf_tool = "tofu"
google_providers = ["google", "google-beta"]
provider_version = "7.14.1"
auto_explode = ["google_project_service", ".*_iam_member"]
validation_level = "warn"
