# satz import configuration — read by `satz import` and `satz adopt`.
#
# Optional top-level sections (the command line overrides them):
#
#   root:                               # live shape (`satz import` with no source)
#     organization: "123456789012"
#     folder: { path: "Shared Services/Prod" }   # or { id: "456789" } — exactly one
#     project: my-prj
#   only: [google_folder, google_project, "google_*_iam_member"]
#   exclude: ["google_*_iam_member"]
#
# `import: true` marks the default set; `satz import --all` takes every type the
# source can deliver instead, `--only` narrows and `--exclude` leaves types out.
# The rows are the provider's resource types at `provider_version`, refreshed by
# scripts/update_import_config.py; `cargo test` holds that version to the pin.
#
# Per resource type: `import` (taken or not), `asset_type` + `content_type` (how
# Cloud Asset Inventory names it), attribute `include`/`exclude`, and the
# adoption rules `satz adopt` reads (`import_id` template, `match_on`,
# `activate: managed`). Keys are the Terraform provider type names.
