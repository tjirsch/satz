#
# ISO/IEC 27001:2022 Annex A — control catalog as a CROSS-WALK (data plane)
#
# NOT a second pack. ISO 27001 is a management-system standard: Annex A names
# no cloud resource, and its evidence in a landing zone IS the benchmark
# verdict. So every technically evidenced control here points at the CIS GCP
# controls that stand as its evidence (`evidence:`), and `require` folds their
# verdicts. Packs keep claiming CIS only; one set of witnesses, no duplication,
# nothing to drift.
#
# Control IDs and their standard names identify the controls. Every paraphrase
# is this project's OWN wording — ISO text is licence-restricted, the same rule
# the CIS catalog follows; consult the standard for authoritative wording.
#
# automatability: technical      — evidenced by the estate, no open duty
#                 partial        — evidenced AND carrying duties a human owes
#                 organizational — a process control; no IaC witness exists
#                 inherited      — the provider's control under shared
#                                  responsibility (all of 7.x), evidenced by
#                                  their certification and never a gap here
#
# duties: named on the CONTROL, not on a pack — they are the human half of the
# control itself and hold whatever an estate declares. Any duty caps the
# verdict at partial: a review that must happen is not discharged by config.
#
# HONESTY OF THIS VIEW: it is exactly as good as the CIS coverage beneath it.
# An estate claiming few CIS controls shows few ISO controls satisfied. That is
# what an auditor sees too, and the reason the cross-walk folds rather than
# asserting anything of its own. Coverage is also bounded by the CIS catalog in
# this repository: an Annex A control whose real-world evidence is a benchmark
# recommendation this catalog does not carry is left organizational rather than
# pointed at an id that would never resolve.
#
